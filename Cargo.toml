[package]
name          = "better-socks"
description   = "Asynchronous SOCKS proxy support for Rust"
version       = "0.1.1"
edition       = "2024"
rust-version  = "1.85"
license       = "Apache-2.0"
readme        = "README.md"
homepage      = "https://github.com/just-android/better-socks"
repository    = "https://github.com/just-android/better-socks"
documentation = "https://docs.rs/better-socks"
categories    = ["asynchronous", "network-programming"]
keywords      = ["tokio", "async", "proxy", "socks", "socks5"]

[features]
tor = []

[[example]]
name              = "socket"
required-features = ["tor"]

[[example]]
name              = "tor"
required-features = ["tor"]

[dependencies]
bytes        = "1"
either       = "1"
futures-core = "0.3"
futures-sink = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
pin-project  = "1"
thiserror    = "2"
tokio        = { version = "1", features = ["io-util", "net"] }
tokio-util   = { version = "0.7", features = ["codec", "net"] }

[dev-dependencies]
futures-executor = "0.3"
once_cell        = "1"
tokio            = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
